<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Invoice Generator</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="invoice-card">
    <!-- Header Section -->
    <header class="invoice-header">
      <div class="brand">
        <h1>INVOICE</h1>
        <p>Dynamic Billing & Receipt Generator</p>
      </div>
      <div class="actions no-print">
        <button id="print-btn" class="btn btn-primary">Print Invoice</button>
      </div>
    </header>

    <!-- Metadata Form Section -->
    <section class="invoice-metadata">
      <div class="field-group">
        <label for="cust-name">Customer Name</label>
        <input type="text" id="cust-name" placeholder="Acme Corp / Jane Doe" value="Acme Corporation">
      </div>
      <div class="field-group">
        <label for="inv-date">Invoice Date</label>
        <input type="date" id="inv-date">
      </div>
      <div class="field-group">
        <label for="inv-number">Invoice #</label>
        <input type="text" id="inv-number" value="INV-2026-001">
      </div>
    </section>

    <!-- Item Entry Controls (Hidden during print) -->
    <section class="item-entry-form no-print">
      <div class="field-group flex-2">
        <label for="item-name">Item Description</label>
        <input type="text" id="item-name" placeholder="Web Development Services">
      </div>
      <div class="field-group">
        <label for="item-qty">Quantity</label>
        <input type="number" id="item-qty" min="1" value="1">
      </div>
      <div class="field-group">
        <label for="item-price">Unit Price ($)</label>
        <input type="number" id="item-price" min="0" step="0.01" placeholder="0.00">
      </div>
      <div class="field-group align-bottom">
        <button id="add-item-btn" class="btn btn-secondary">Add Item</button>
      </div>
    </section>

    <!-- Line Items Table -->
    <section class="table-container">
      <table class="invoice-table">
        <thead>
          <tr>
            <th class="text-left">Item</th>
            <th class="text-center">Qty</th>
            <th class="text-right">Unit Price</th>
            <th class="text-right">Total</th>
            <th class="text-center no-print">Action</th>
          </tr>
        </thead>
        <tbody id="invoice-items">
          <!-- Dynamically populated via JS -->
        </tbody>
      </table>
    </section>

    <!-- Summary & Totals -->
    <section class="invoice-summary">
      <div class="summary-details">
        <div class="summary-row">
          <span>Subtotal:</span>
          <span id="subtotal-val">$0.00</span>
        </div>
        <div class="summary-row">
          <span>Tax (18%):</span>
          <span id="tax-val">$0.00</span>
        </div>
        <div class="summary-row grand-total">
          <span>Grand Total:</span>
          <span id="grand-total-val">$0.00</span>
        </div>
      </div>
    </section>
  </div>

  <script src="script.js"></script>
</body>
</html>
